[project]
name = "finjk-agentcore"
version = "0.1.0"
description = "FinJK multi-agent fundamental analysis on AgentCore"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore >= 1.25.2, < 2.0.0",
    "botocore[crt] ~= 1.43.0",

    "strands-agents[openai]>=1.60.0,<2.0.0",
    "strands-agents-tools>=0.8.9,<0.9.0",

    "yfinance>=1.7.0",
    "alpha_vantage>=3.0.0",
    "pandas>=2.0.0",
    "boto3>=1.40.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "vaderSentiment>=3.3.2",
    "cachetools==6.2.4"
]

[tool.hatch.build.targets.wheel]
packages = ["."]